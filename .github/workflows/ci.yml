name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log

      - name: Summarise test failures
        if: failure()
        run: |
          # Test failures otherwise exist only inside the raw log. Lift them into
          # the job summary and into annotations, and fall back to the log tail so
          # a crash that prints no failure marker is still visible.
          LOG=/tmp/test.log
          [ -f "$LOG" ] || exit 0

          {
            echo '### Failing tests'
            echo '```'
            grep -E '(✕|●|FAIL|Tests:|Test Suites:|Test Files)' "$LOG" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -qE '●.*›' "$LOG"; then
            grep -E '●.*›' "$LOG" | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            tail -40 "$LOG" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee /tmp/test.log

      - name: Summarise test failures
        if: failure()
        run: |
          # Same idea as the backend job: surface failures without the raw log
          LOG=/tmp/test.log
          [ -f "$LOG" ] || exit 0

          {
            echo '### Failing tests'
            echo '```'
            grep -E '(✕|●|FAIL|Tests:|Test Suites:|Test Files)' "$LOG" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -qE '●.*›' "$LOG"; then
            grep -E '●.*›' "$LOG" | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            tail -40 "$LOG" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi

      - name: Build
        run: npm run build
